name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  # A Studio release published here puts its version and notes on the site (src/lib/studio-release.ts).
  release:
    types: [published]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run
      - run: pnpm build
        env:
          STUDIO_RELEASE_REQUIRED: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=life2film-site --branch=production
