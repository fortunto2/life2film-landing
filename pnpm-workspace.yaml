allowBuilds:
  esbuild: set this to true or false
  sharp: set this to true or false
# pnpm 11 refuses packages published less than a day ago (minimumReleaseAge, a supply-chain guard).
# life2film-engine is our own build from the sibling repository, published minutes before it is
# installed here, so every release of it would be refused. Excluded by name; the guard stays on for
# everything else.
minimumReleaseAgeExclude:
  - life2film-engine

# The build scripts pnpm 11 asks about interactively (`pnpm approve-builds`); approved here so an
# install from a script does not stop to ask. esbuild downloads its binary, sharp builds libvips.
onlyBuiltDependencies:
  - esbuild
  - sharp

# `pnpm run` re-verifies node_modules first and refuses to run on any doubt (pnpm 11 default). The
# deploy script was failing on that check, not on the build. Install explicitly; run just runs.
verifyDepsBeforeRun: false
